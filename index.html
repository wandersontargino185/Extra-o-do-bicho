<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extrator Bicho PE v3 - 1 ao 5</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Inter,Arial,sans-serif; }
  body { background:#0f172a; color:#f8fafc; padding:20px; display:flex; justify-content:center; }
.container { width:100%; max-width:650px; background:rgba(255,255,255,0.08); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.12); border-radius:24px; padding:24px; }
  h1 { font-size:24px; margin-bottom:8px; text-align:center; }
  p { color:#cbd5e1; font-size:14px; text-align:center; margin-bottom:20px; }
  label { font-size:13px; color:#cbd5e1; display:block; margin:12px 0 6px; }
  input[type="date"] { width:100%; padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.08); color:white; }
.row { display:flex; gap:12px; }
.row > div { flex:1; }
  button { width:100%; padding:14px; border:none; border-radius:14px; font-weight:700; font-size:15px;
    cursor:pointer; margin-top:12px; transition:all 0.2s; }
  button:hover { transform:translateY(-2px); opacity:0.95; }
  button:disabled { opacity:0.6; cursor:not-allowed; }
.btn-primary { background:linear-gradient(135deg,#8b5cf6,#7c3aed); color:white; }
.btn-success { background:linear-gradient(135deg,#22c55e,#16a34a); color:white; }
.btn-stop { background:linear-gradient(135deg,#ef4444,#dc2626); color:white; }
.log { background:rgba(0,0,0,0.3); border-radius:12px; padding:12px; margin-top:16px; font-size:13px;
    max-height:300px; overflow:auto; white-space:pre-wrap; font-family:monospace; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
.stat-box { background:rgba(255,255,255,0.06); padding:12px; border-radius:12px; text-align:center; }
.stat-box b { font-size:20px; display:block; }
.hidden { display:none; }
  @media(max-width:600px){.row { flex-direction:column; }.stats { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="container">
  <h1>🎲 Olá, Extrator Bicho PE v3</h1>
  <p>Só 1º ao 5º prêmio, sem duplicatas</p>

  <div class="row">
    <div>
      <label>Data Início</label>
      <input type="date" id="dataInicio">
    </div>
    <div>
      <label>Data Fim</label>
      <input type="date" id="dataFim">
    </div>
  </div>

  <button class="btn-primary" id="btnStart" onclick="iniciar()">🚀 Iniciar Extração</button>
  <button class="btn-stop hidden" id="btnStop" onclick="parar()">⏹️ Parar</button>
  <button class="btn-success hidden" id="btnDownload" onclick="baixarTXT()">📥 Baixar TXT</button>

  <div class="stats hidden" id="stats">
    <div class="stat-box">
      <span>Total</span>
      <b id="totalNum">0</b>
    </div>
    <div class="stat-box">
      <span>Dias OK</span>
      <b id="diasOk">0</b>
    </div>
  </div>

  <div class="log" id="log">Aguardando início...</div>
</div>

<script>
const PROXIES = [
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.io/?',
  'https://api.codetabs.com/v1/proxy?quest='
];

let rodando = false;
let resultados = [];
let setResultados = new Set();
let diasOk = 0;

document.getElementById('dataInicio').valueAsDate = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
document.getElementById('dataFim').valueAsDate = new Date();

function log(msg) {
  const logEl = document.getElementById('log');
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

function updateStats() {
  document.getElementById('totalNum').textContent = resultados.length;
  document.getElementById('diasOk').textContent = diasOk;
  document.getElementById('stats').classList.remove('hidden');
}

function gerarDatas(inicio, fim) {
  const arr = [];
  let dt = new Date(inicio);
  const dtFim = new Date(fim);
  while (dt <= dtFim) {
    arr.push(dt.toISOString().slice(0,10));
    dt.setDate(dt.getDate() + 1);
  }
  return arr;
}

async function fetchComFallback(url) {
  for (let proxy of PROXIES) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    try {
      const res = await fetch(proxy + encodeURIComponent(url), { signal: controller.signal });
      clearTimeout(timeoutId);
      if (res.ok) return await res.text();
    } catch (e) {
      clearTimeout(timeoutId);
      // continua para o próximo proxy
    }
  }
  throw new Error('Todos os proxies falharam');
}

/**
 * Extrai os números do 1º ao 5º prêmio do HTML.
 * Estratégia: busca por padrões como "1º" (ou "1º Prêmio") seguido de um número de 4 dígitos,
 * ignorando separadores comuns (espaço, ponto, hífen, dois pontos).
 * Fallback: se não achar, tenta a abordagem da tabela.
 */
function extrairMilhar1a5(html) {
  // Remove quebras de linha e espaços extras para facilitar a regex
  const texto = html.replace(/\s+/g, ' ');

  // Padrão: "1º" (ou "1º Prêmio") + separadores opcionais + 4 dígitos
  // Vamos capturar para cada posição 1 a 5
  const milhares = [];
  const regex = /([1-5])º\s*(?:Pr[êe]mio\s*)?[:.\-]?\s*(\d{4})/gi;
  let match;
  const found = new Map();
  while ((match = regex.exec(texto)) !== null) {
    const pos = parseInt(match[1], 10);
    const num = match[2];
    // Só aceita se a posição for de 1 a 5 e ainda não tiver sido capturada
    if (pos >= 1 && pos <= 5 && !found.has(pos)) {
      found.set(pos, num);
    }
  }

  // Ordena por posição e retorna os números
  for (let i = 1; i <= 5; i++) {
    if (found.has(i)) milhares.push(found.get(i));
  }

  // Se a regex não encontrou nada, tenta a abordagem da tabela (fallback)
  if (milhares.length === 0) {
    return extrairMilharPorTabela(html);
  }

  return milhares;
}

function extrairMilharPorTabela(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const milhares = [];

  // Tenta várias classes possíveis para a tabela
  let tabela = doc.querySelector('table.resultado, table.tabelaResultado, table[class*="result"]');
  if (!tabela) {
    // Pega a primeira tabela com mais de 3 linhas
    const todas = doc.querySelectorAll('table');
    for (let t of todas) {
      if (t.querySelectorAll('tr').length > 3) {
        tabela = t;
        break;
      }
    }
  }
  if (!tabela) tabela = doc.querySelector('table');
  if (!tabela) return [];

  const linhas = tabela.querySelectorAll('tr');
  let count = 0;
  for (let linha of linhas) {
    if (count >= 5) break;
    const celulas = linha.querySelectorAll('td');
    if (celulas.length >= 2) {
      const texto = celulas[1].textContent.trim();
      const match = texto.match(/\b(\d{4})\b/);
      if (match) {
        milhares.push(match[1]);
        count++;
      }
    }
  }
  return milhares;
}

async function iniciar() {
  const inicio = document.getElementById('dataInicio').value;
  const fim = document.getElementById('dataFim').value;

  if (!inicio || !fim) return alert('Preenche as duas datas');
  if (new Date(inicio) > new Date(fim)) return alert('Data início maior que fim');

  const datas = gerarDatas(inicio, fim);
  if (datas.length > 90 && !confirm(`Vai puxar ${datas.length} dias. Continuar?`)) return;

  rodando = true;
  resultados = [];
  setResultados.clear();
  diasOk = 0;
  document.getElementById('log').textContent = '';
  document.getElementById('btnStart').classList.add('hidden');
  document.getElementById('btnStop').classList.remove('hidden');
  document.getElementById('btnDownload').classList.add('hidden');

  log(`Iniciando ${datas.length} dias - PE - Só 1º ao 5º prêmio`);
  log('================================\n');

  for (let i = 0; i < datas.length && rodando; i++) {
    const data = datas[i];
    log(`[${i+1}/${datas.length}] ${data}... `);

    try {
      // Tenta primeiro com a URL padrão
      let url = `https://www.resultadofacil.com.br/resultado-do-jogo-do-bicho/pe/do-dia/${data}`;
      let html;
      try {
        html = await fetchComFallback(url);
      } catch (e) {
        // Fallback: tentar sem o "do-dia"
        url = `https://www.resultadofacil.com.br/resultado-do-jogo-do-bicho/pe/${data}`;
        html = await fetchComFallback(url);
      }

      const milhares = extrairMilhar1a5(html);
      // Filtra apenas números de 4 dígitos e não duplicados
      const novos = milhares.filter(m => m.length === 4 && !setResultados.has(m));

      novos.forEach(m => {
        resultados.push(m);
        setResultados.add(m);
      });

      if (novos.length > 0) diasOk++;
      log(`+${novos.length} resultados (${milhares.length} capturados)`);
      updateStats();

    } catch (err) {
      log(`ERRO: ${err.message}`);
    }

    await new Promise(r => setTimeout(r, 2000));
  }

  rodando = false;
  document.getElementById('btnStop').classList.add('hidden');
  document.getElementById('btnStart').classList.remove('hidden');

  if (resultados.length > 0) {
    document.getElementById('btnDownload').classList.remove('hidden');
    log(`\n✅ Finalizado!`);
    log(`Total: ${resultados.length} milhares`);
    log(`Dias com resultado: ${diasOk}/${datas.length}`);
  } else {
    log('\n❌ Nenhum resultado encontrado');
  }
}

function parar() {
  rodando = false;
  log('\n⏹️ Parado pelo usuário');
}

function baixarTXT() {
  const conteudo = resultados.join('\n');
  const blob = new Blob([conteudo], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  const inicio = document.getElementById('dataInicio').value;
  const fim = document.getElementById('dataFim').value;
  a.download = `bicho_pe_1a5_${inicio}_ate_${fim}_${resultados.length}.txt`;

  a.href = url;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
