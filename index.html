<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Milhares - Jogo do Bicho (com download)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            background-color: #f4f7fa;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 250px;
            padding: 10px;
            font-size: 14px;
            border: 2px solid #b0c4de;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #fff;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.download {
            background-color: #27ae60;
        }
        button.download:hover {
            background-color: #219150;
        }
        button.reset {
            background-color: #e74c3c;
        }
        button.reset:hover {
            background-color: #c0392b;
        }
        .result-area {
            background-color: #ecf0f1;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #bdc3c7;
            max-height: 400px;
            overflow-y: auto;
        }
        .result-area h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .result-area pre {
            white-space: pre-wrap;
            word-break: break-all;
            background: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        .stats {
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <h1>🔢 Extrator de Milhares - Jogo do Bicho</h1>
    <p>Cole o texto completo do resultado (como você envia para o assistente) e clique em <strong>"Extrair e Baixar"</strong>.</p>
    <p>O arquivo gerado terá o formato: <br> <code>2026</code> (ano) <br> <code>0001</code> (marcador) <br> e todas as milhares extraídas, uma por linha.</p>

    <textarea id="inputText" placeholder="Cole aqui todo o resultado..."></textarea>

    <div class="button-group">
        <button onclick="extrairEBaixar()" class="download">Extrair e Baixar</button>
        <button class="reset" onclick="limpar()">Limpar</button>
    </div>

    <div class="result-area" id="resultArea" style="display:none;">
        <h3>📋 Visualização do Arquivo</h3>
        <div id="stats" class="stats"></div>
        <pre id="resultContent"></pre>
    </div>

    <script>
        function extrairMilhares(texto) {
            // Busca números com exatamente 4 dígitos (borda de palavra)
            const regex = /\b(\d{4})\b/g;
            const matches = [...texto.matchAll(regex)].map(m => m[1]);
            return matches;
        }

        function gerarConteudoArquivo(milhares) {
            // Formato: 2026, 0001, depois cada milhar em nova linha
            return '2026\n0001\n' + milhares.join('\n');
        }

        function extrairEBaixar() {
            const texto = document.getElementById('inputText').value;
            if (!texto.trim()) {
                alert('Por favor, cole algum texto primeiro.');
                return;
            }

            const milhares = extrairMilhares(texto);
            if (milhares.length === 0) {
                alert('Nenhuma milhar encontrada no texto.');
                return;
            }

            // Gerar conteúdo do arquivo
            const conteudo = gerarConteudoArquivo(milhares);

            // Mostrar visualização
            const resultArea = document.getElementById('resultArea');
            const stats = document.getElementById('stats');
            const content = document.getElementById('resultContent');
            stats.textContent = `✅ ${milhares.length} milhares extraídas.`;
            content.textContent = conteudo;
            resultArea.style.display = 'block';

            // Baixar o arquivo
            const blob = new Blob([conteudo], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            // Nome do arquivo com data atual (opcional)
            const now = new Date();
            const dataStr = now.toISOString().slice(0,10).replace(/-/g, '');
            link.download = `bicho_pe_${dataStr}_extraido.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function limpar() {
            document.getElementById('inputText').value = '';
            document.getElementById('resultArea').style.display = 'none';
        }
    </script>

</body>
</html>
